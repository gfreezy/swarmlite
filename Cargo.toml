[package]
name = "swarmlite"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "A small single-controller container orchestrator for one LAN or region"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bollard = "0.21"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
swarmlite-stack = { path = "crates/swarmlite-stack" }
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.24"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = [".", "crates/swarmlite-stack"]
resolver = "3"
