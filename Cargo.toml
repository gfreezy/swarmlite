[workspace]
members = [
    ".",
    "crates/swarmlite-agent",
    "crates/swarmlite-cli",
    "crates/swarmlite-client",
    "crates/swarmlite-controller",
    "crates/swarmlite-core",
    "crates/swarmlite-node",
    "crates/swarmlite-platform",
    "crates/swarmlite-protocol",
    "crates/swarmlite-stack",
]
resolver = "3"

[workspace.package]
version = "0.1.22"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bollard = "0.21"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.24"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }

swarmlite-agent = { path = "crates/swarmlite-agent" }
swarmlite-cli = { path = "crates/swarmlite-cli" }
swarmlite-client = { path = "crates/swarmlite-client" }
swarmlite-controller = { path = "crates/swarmlite-controller" }
swarmlite-core = { path = "crates/swarmlite-core" }
swarmlite-node = { path = "crates/swarmlite-node" }
swarmlite-platform = { path = "crates/swarmlite-platform" }
swarmlite-protocol = { path = "crates/swarmlite-protocol" }
swarmlite-stack = { path = "crates/swarmlite-stack" }

[package]
name = "swarmlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small single-controller container orchestrator for one LAN or region"

[dependencies]
swarmlite-cli.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.release]
lto = "thin"
strip = true
