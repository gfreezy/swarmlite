[package]
name = "swarmlite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A small S3-backed container orchestrator with Swarm-style stack files and Traefik ingress"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = "1.8"
aws-sdk-s3 = "1.140"
aws-smithy-types = "1.3"
axum = { version = "0.8", features = ["json"] }
bollard = "0.21"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
humantime = "2.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.24"

[profile.release]
lto = "thin"
strip = true
