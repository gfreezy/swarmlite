[package]
name = "swarmlite-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Swarmlite Stack parser, routing validation, and Caddy JSON renderer"

[dependencies]
anyhow = "1.0"
gtmpl.workspace = true
humantime = "2.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1.1"
