entryPoints:
  web:
    address: :80
  websecure:
    address: :443

providers:
  http:
    # This may be either controller; followers refresh the same committed snapshot.
    endpoint: http://10.0.0.10:8080/v1/traefik
    pollInterval: 2s
    pollTimeout: 3s
    headers:
      Authorization: Bearer change-me

api:
  dashboard: true

log:
  level: INFO

