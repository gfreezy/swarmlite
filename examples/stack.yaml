# yaml-language-server: $schema=https://raw.githubusercontent.com/gfreezy/swarmlite/main/crates/swarmlite-stack/schema/stack.schema.json
services:
  web:
    image: nginx:1.29-alpine
    expose:
      - "80"
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.role==app
      update_config:
        parallelism: 1
        order: start-first

x-swarmlite:
  name: demo
  tls: serve
  http: redirect
  http_routes:
    - hostnames:
        - example.com
      rules:
        - backend:
            service: web
            protocol: http
            preserve_host: true
