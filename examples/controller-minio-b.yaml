cluster_id: local-test
controller_id: controller-local-b
listen: 127.0.0.1:18081
advertise_url: http://127.0.0.1:18081
auth_token: local-test-token

storage:
  bucket: swarmlite
  prefix: clusters/local-test
  region: us-east-1
  endpoint_url: http://127.0.0.1:19000
  force_path_style: true

lease:
  duration_seconds: 15
  renew_interval_seconds: 5
  clock_skew_seconds: 1

node_timeout_seconds: 12
reconcile_interval_seconds: 1

