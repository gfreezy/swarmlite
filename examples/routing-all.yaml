# yaml-language-server: $schema=https://raw.githubusercontent.com/gfreezy/swarmlite/main/crates/swarmlite-stack/schema/stack.schema.json
services:
  web:
    image: example/web:latest
    expose: [3000]
    deploy:
      replicas: 3

  api:
    image: example/api:latest
    expose: [8080]
    deploy:
      replicas: 3

  versioned_api:
    image: example/versioned-api:latest
    expose: [8080]

  health:
    image: example/health:latest
    expose: [8080]

  h2c_api:
    image: example/h2c-api:latest
    expose: [8080]
    deploy:
      replicas: 2

x-swarmlite:
  # Every proxied response is compressed by default with zstd or gzip once it
  # reaches Caddy's 512-byte minimum. No Stack configuration is required.
  # Defaults inherited by routes which do not override these fields.
  tls: serve
  http: redirect
  # Default trusted proxies inherited by every route unless overridden.
  trusted_proxies: [private_ranges]

  http_routes:
    # HTTPS plus HTTP -> HTTPS redirect.
    - hostnames:
        - example.com
        - www.example.com
      # Redirect www.example.com to example.com while preserving path and query.
      canonical_hostname: example.com
      rules:
        # exact
        - matches:
            - path: /health
              type: exact
          backend:
            service: health
            protocol: http
            preserve_host: true

        # exact + ignore_case + replace_path
        - matches:
            - path: /READY
              type: exact
              ignore_case: true
          rewrite:
            replace_path: /internal/ready
          backend:
            service: health

        # prefix is the default type
        - matches:
            - path: /api
          # Cache is opt-in per rule. It uses the Gateway's persistent SQLite volume
          # and ignores upstream Cache-Control headers.
          cache:
            ttl: 5m
            stale: 30s
            key:
              hash: true
              headers: [Accept-Language]
          rewrite:
            strip_prefix: true
          backend:
            service: api

        # prefix + ignore_case + replace_prefix
        - matches:
            - path: /public-api
              type: prefix
              ignore_case: true
          rewrite:
            replace_prefix: /v1
          backend:
            service: versioned_api
            preserve_host: false

        # regex
        - matches:
            - path: ^/users/[0-9]+/avatar$
              type: regex
              ignore_case: true
          backend:
            service: api

        # Multiple matches in one rule are OR.
        - matches:
            - path: /login
              type: exact
            - path: /signin
              type: exact
          backend:
            service: web

        # No matches is the fallback rule.
        - backend:
            service: web

    # External HTTPS proxy; Host is changed to api.revenuecat.com.
    - hostnames:
        - revenuecat.example.com
      rules:
        - matches:
            - path: /revenuecat
          rewrite:
            strip_prefix: true
          backend:
            host: api.revenuecat.com
            port: 443
            protocol: https
            preserve_host: false

        - matches:
            - path: /status
              type: exact
          rewrite:
            replace_path: /health
          backend:
            host: api.revenuecat.com
            port: 443
            protocol: https
            preserve_host: false

    # External HTTPS proxy which preserves the incoming HTTP Host header.
    - hostnames:
        - upstream-proxy.example.com
      rules:
        - backend:
            host: upstream.example.net
            port: 443
            protocol: https
            preserve_host: true

    # External plain HTTP proxy.
    - hostnames:
        - http-upstream.example.com
      rules:
        - backend:
            host: upstream.example.net
            port: 8080
            protocol: http
            preserve_host: false

    # Internal h2c backend.
    - hostnames:
        - h2c.example.com
      rules:
        - matches:
            - path: /rpc
          rewrite:
            strip_prefix: true
          backend:
            service: h2c_api
            protocol: h2c

    # HTTP only.
    - hostnames:
        - insecure.example.com
      tls: disabled
      http: serve
      rules:
        - backend:
            service: web

    # HTTP and HTTPS without a redirect.
    - hostnames:
        - mixed.example.com
      tls: serve
      http: serve
      rules:
        - backend:
            service: web

    # HTTPS only.
    - hostnames:
        - secure-only.example.com
      tls: serve
      http: disabled
      rules:
        - backend:
            service: web
