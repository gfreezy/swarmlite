node_id: node-a
advertise_address: 10.0.0.21
controllers:
  - http://10.0.0.10:8080
  - http://10.0.0.11:8080

# Prefer the SWARMLITE_TOKEN environment variable in production.
auth_token: change-me
docker_socket: /var/run/docker.sock
state_file: /var/lib/swarmlite/agent-state.json
heartbeat_interval_seconds: 5

labels:
  role: app
  zone: rack-a

port_range:
  start: 20000
  end: 29999

