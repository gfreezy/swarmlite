name: Caddy image

on:
  push:
    branches:
      - "**"
    paths:
      - caddy-storage/**
      - .github/workflows/caddy-image.yml
  pull_request:
    paths:
      - caddy-storage/**
      - .github/workflows/caddy-image.yml

permissions:
  contents: read

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caddy-image:
    name: Caddy image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/swarmlite-caddy
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Caddy image
        uses: docker/build-push-action@v7
        with:
          context: caddy-storage
          file: caddy-storage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddy-image
          cache-to: type=gha,mode=max,scope=caddy-image
