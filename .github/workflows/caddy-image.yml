name: Caddy image

on:
  workflow_call:
  pull_request:
    paths:
      - caddy-storage/**
      - .github/workflows/caddy-image.yml

permissions:
  contents: read

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategy:
    name: Select Caddy image strategy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.strategy.outputs.mode }}
      source_digest: ${{ steps.strategy.outputs.source_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select release image strategy
        id: strategy
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/swarmlite-caddy
        run: |
          set -euo pipefail
          write_outputs() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          write_outputs "mode=build"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi

          package_version=$(awk '
            $0 == "[workspace.package]" { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version = / {
              sub(/^[^"]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match Cargo package version v$package_version" >&2
            exit 1
          fi

          inspect_digest() {
            docker buildx imagetools inspect "$1" 2>/dev/null \
              | awk '$1 == "Digest:" && !found { print $2; found = 1 }'
          }

          target_ref="$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
          commit_ref="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          target_digest=$(inspect_digest "$target_ref" || true)
          commit_digest=$(inspect_digest "$commit_ref" || true)
          if [[ -n "$target_digest" ]]; then
            if [[ -z "$commit_digest" || "$target_digest" != "$commit_digest" ]]; then
              echo "$target_ref already exists without the matching immutable commit image" >&2
              exit 1
            fi
            write_outputs "mode=existing" "source_digest=$target_digest"
            exit 0
          fi

          previous_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [[ -z "$previous_tag" ]]; then
            exit 0
          fi
          current_tree=$(git rev-parse "$GITHUB_SHA:caddy-storage")
          previous_tree=$(git rev-parse "$previous_tag:caddy-storage")
          if [[ "$current_tree" != "$previous_tree" ]]; then
            exit 0
          fi

          previous_ref="$IMAGE_REPOSITORY:$previous_tag"
          previous_digest=$(inspect_digest "$previous_ref" || true)
          if [[ -z "$previous_digest" ]]; then
            echo "$previous_ref is unavailable; building the release image instead" >&2
            exit 0
          fi
          write_outputs \
            "mode=reuse" \
            "source_digest=$previous_digest" \
            "previous_tag=$previous_tag"

  build:
    name: Caddy image (${{ matrix.platform }})
    needs: strategy
    if: needs.strategy.outputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact-suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact-suffix: arm64
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/swarmlite-caddy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/swarmlite-caddy

      - name: Build Caddy image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: caddy-storage
          file: caddy-storage/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Caddy image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: caddy-storage
          file: caddy-storage/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/caddy-digests
        run: |
          set -euo pipefail
          if [[ "$IMAGE_DIGEST" != sha256:* ]]; then
            echo "unexpected image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: caddy-digest-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/caddy-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Caddy image
    needs:
      - strategy
      - build
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.strategy.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/swarmlite-caddy
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        if: needs.strategy.outputs.mode == 'build'
        uses: actions/download-artifact@v8
        with:
          pattern: caddy-digest-*
          path: ${{ runner.temp }}/caddy-digests
          merge-multiple: true

      - name: Publish image manifest
        env:
          MODE: ${{ needs.strategy.outputs.mode }}
          SOURCE_DIGEST: ${{ needs.strategy.outputs.source_digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/caddy-digests
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag_arguments=(--tag "$IMAGE_REPOSITORY:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_arguments+=(
              --tag "$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
              --tag "$IMAGE_REPOSITORY:latest"
            )
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            tag_arguments+=(--tag "$IMAGE_REPOSITORY:latest")
          fi

          case "$MODE" in
            build)
              mapfile -t digest_files < <(find "$DIGEST_DIRECTORY" -maxdepth 1 -type f | sort)
              if [[ "${#digest_files[@]}" -ne 2 ]]; then
                echo "expected two platform digests, found ${#digest_files[@]}" >&2
                exit 1
              fi
              image_sources=()
              for digest_file in "${digest_files[@]}"; do
                image_sources+=("$IMAGE_REPOSITORY@sha256:$(basename "$digest_file")")
              done
              docker buildx imagetools create "${tag_arguments[@]}" "${image_sources[@]}"
              ;;
            reuse)
              docker buildx imagetools create \
                "${tag_arguments[@]}" \
                "$IMAGE_REPOSITORY@$SOURCE_DIGEST"
              ;;
            existing)
              ;;
            *)
              echo "unsupported image strategy: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Verify release image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MODE: ${{ needs.strategy.outputs.mode }}
          REUSED_DIGEST: ${{ needs.strategy.outputs.source_digest }}
        run: |
          set -euo pipefail
          inspect_digest() {
            docker buildx imagetools inspect "$1" \
              | awk '$1 == "Digest:" && !found { print $2; found = 1 }'
          }
          release_ref="$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
          commit_ref="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          release_digest=$(inspect_digest "$release_ref")
          commit_digest=$(inspect_digest "$commit_ref")
          if [[ -z "$release_digest" || "$release_digest" != "$commit_digest" ]]; then
            echo "release and commit tags do not resolve to the same image digest" >&2
            exit 1
          fi
          if [[ "$MODE" == "reuse" && "$release_digest" != "$REUSED_DIGEST" ]]; then
            echo "retagged release digest $release_digest differs from source $REUSED_DIGEST" >&2
            exit 1
          fi
          inspection=$(docker buildx imagetools inspect "$release_ref")
          grep -q 'Platform:.*linux/amd64' <<< "$inspection"
          grep -q 'Platform:.*linux/arm64' <<< "$inspection"
          {
            echo "### Gateway image"
            echo
            echo "- Tag: \`$release_ref\`"
            echo "- Digest: \`$release_digest\`"
            echo "- Strategy: \`$MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"
