name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

  cli-build:
    name: CLI (${{ matrix.artifact }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: swarmlite-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: swarmlite-linux-arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: swarmlite-macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release CLI
        run: cargo build --release --locked --bin swarmlite --target ${{ matrix.target }}

      - name: Verify fully static Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/swarmlite"
          file "$binary"
          if readelf --program-headers --wide "$binary" | grep -q 'INTERP'; then
            echo 'Linux release binary contains a dynamic ELF interpreter' >&2
            exit 1
          fi
          if readelf --dynamic --wide "$binary" 2>&1 | grep -q '(NEEDED)'; then
            echo 'Linux release binary depends on a shared library' >&2
            exit 1
          fi

      - name: Package CLI
        shell: bash
        run: |
          mkdir -p dist
          artifact_filename="${{ matrix.artifact }}.tar.gz"
          artifact_path="dist/$artifact_filename"
          tar -C "target/${{ matrix.target }}/release" -czf "$artifact_path" swarmlite
          cd dist
          shasum -a 256 "$artifact_filename" > "$artifact_filename.sha256"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*
          if-no-files-found: error

  release-gate:
    name: Wait for main checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for matching main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          main_run_id=
          for _ in {1..60}; do
            main_run_id=$(gh run list \
              --workflow CI \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json databaseId,headBranch \
              --jq '.[] | select(.headBranch == "main") | .databaseId' \
              | head -n 1)
            [[ -z "$main_run_id" ]] || break
            sleep 2
          done
          [[ -n "$main_run_id" ]] || {
            echo "could not find the main CI run for $GITHUB_SHA" >&2
            exit 1
          }
          gh run watch "$main_run_id" --exit-status --interval 10

  gateway-release:
    name: Publish Gateway image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/caddy-image.yml
    secrets: inherit

  cli-release:
    name: Publish CLI release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - cli-build
      - gateway-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swarmlite-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            install.sh \
            packaging/systemd/swarmlite.service \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

  go:
    name: Go
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: caddy-storage
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: caddy-storage/go.mod
          cache-dependency-path: caddy-storage/go.sum

      - name: Run Go tests
        run: go test ./...

  packaging:
    name: Packaging
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check installer
        run: |
          test -x install.sh
          sh -n install.sh
          shellcheck install.sh
          ./install.sh --help | grep -q -- '--uninstall'
          if ./install.sh --purge 2>/dev/null; then
            echo '--purge unexpectedly succeeded without --uninstall' >&2
            exit 1
          fi

      - name: Verify systemd unit
        run: |
          sudo install -m 0755 /bin/true /usr/local/bin/swarmlite
          systemd-analyze verify packaging/systemd/swarmlite.service
